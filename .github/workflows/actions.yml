name: Build and Release Executables

on:
  push:
    tags:
      - 'v*.*.*' # Triggers on release tags like v1.0.0, v2.1.0
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: main-linux
            binary_path: dist/main
          - os: windows-latest
            artifact_name: main-windows.exe
            binary_path: dist/main.exe
          - os: macos-latest
            artifact_name: main-macos
            binary_path: dist/main

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Executable
        run: pyinstaller --onefile main.py

      - name: Rename Binary for Artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/main.exe dist/${{ matrix.artifact_name }}
          else
            mv dist/main dist/${{ matrix.artifact_name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true